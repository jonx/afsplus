[workspace]
resolver = "2"
members = [
    "crates/afsplus-format",
    "crates/afsplus-block",
    "crates/afsplus-core",
    "crates/afsplus-check",
    "crates/afsplus-vfs",
    "crates/afsplus-fuse",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/jonx/afsplus"

[workspace.lints.rust]
unsafe_code = "forbid"
