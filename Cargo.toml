[workspace]
resolver = "2"
members = [
    "crates/afsplus-format",
    "crates/afsplus-crc-hw",
    "crates/afsplus-block",
    "crates/afsplus-core",
    "crates/afsplus-check",
    "crates/afsplus-measure",
    "crates/afsplus-tools",
    "crates/afsplus-vfs",
    "crates/afsplus-backup",
    "crates/afsplus-aros",
    "crates/afsplus-aros-ffi",
    "crates/afsplus-fuse",
    "crates/afsplus-macfuse-sys",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/jonx/afsplus"

[workspace.lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
# A narrowly patched fuser 0.18.0 adds a message-oriented SessionTransport.
# This is required by macFUSE's FSKit backend, which deliberately has no
# /dev/fuse file descriptor. Regular device-backed paths remain unchanged.
fuser = { path = "vendor/fuser" }

# Tests read thousands of metadata blocks and check each one's CRC32C. The
# eight-table loop that makes it fast is six times slower than the byte loop
# when unoptimized, so the format crate is optimized in test builds too;
# debug assertions and overflow checks stay on.
[profile.dev.package.afsplus-format]
opt-level = 3
