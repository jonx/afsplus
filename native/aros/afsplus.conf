##begin config
version 0.1
basename afsplus
residentpri -1
handler_func handler
##end config

##begin handler
# The stack of a boot mount, and it comes before the entries it applies to:
# genmodule copies the directive into each entry as that entry is read
# (tools/genmodule/config.c). A DOSDriver says StackSize itself and every
# AFS+ mountlist here says 262144; a partition the boot scan finds has no
# DOSDriver and would keep partition.library's 40 KiB, which the handler task
# runs out of while it replays an intent log after a cut -- S3 found it doing
# exactly that, "Task AFSSYS went out of stack limits". FileSystem.resource
# carries the size in 32-bit words and rom/dos/cliinit.c scales it to the
# pointer size, so this is the same 262144 bytes.
.stacksize 131072
DosType=0x4146532b
Resident=afsplus-handler
##end handler
