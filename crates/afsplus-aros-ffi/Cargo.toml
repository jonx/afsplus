[package]
name = "afsplus-aros-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
# A build that counts the allocations the meter sees, for the memory
# measurements of the performance programme. Off by default: the counting
# sits in the library's hottest path.
heap-profile = []

[dependencies]
afsplus-aros = { path = "../afsplus-aros" }
afsplus-block = { path = "../afsplus-block" }
afsplus-core = { path = "../afsplus-core" }
afsplus-format = { path = "../afsplus-format" }
afsplus-vfs = { path = "../afsplus-vfs" }

[dev-dependencies]
afsplus-check = { path = "../afsplus-check" }

[lints.rust]
# The AROS targets are custom JSON targets, so the compiler's list of known
# operating systems does not carry `aros`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("aros"))'] }
# Raw pointers and C callbacks are confined to this boundary crate. The safe
# filesystem crates retain the workspace-wide `unsafe_code = "forbid"` rule.
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
