[package]
name = "afsplus-backup"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
consumer = ["dep:afsplus-vfs", "dep:afsplus-format"]

[dependencies]
afsplus-format = { path = "../afsplus-format", optional = true }
afsplus-vfs = { path = "../afsplus-vfs", optional = true }
sha2 = { version = "0.11", default-features = false }

[lints]
workspace = true

[dev-dependencies]
afsplus-format = { path = "../afsplus-format" }
afsplus-core = { path = "../afsplus-core" }
afsplus-block = { path = "../afsplus-block" }
