[package]
name = "afsplus-core"
description = "Portable AFS+ core prototype: mkfs, mount, checkpoint COW commit."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
allocation-tracing = []
# Check the CRC32C of a cached block's bytes again every time its kept
# decoded form is reused. Off by default: the decoded form is what is used,
# and the check covers only the bytes beside it (docs/20-performance.md).
verify-cached-metadata = []

[dependencies]
afsplus-format = { path = "../afsplus-format" }
afsplus-block = { path = "../afsplus-block" }
caseless = "0.2.2"
# Keep normalization and case-fold tables on the same frozen Unicode release.
unicode-normalization = "=0.1.24"

[lints]
workspace = true
