registry_version = 4

[[feature]]
id = "org.aros.afsplus:intent-log"
short = "intent-log"
class = "incompat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Bounded logical durability log layered over checkpoint COW (ADR-037/063). Unknown active records cannot be ignored by a read-write mount."

[[feature]]
id = "org.aros.afsplus:intent-log-data-updates"
short = "intent-log-data-updates"
class = "incompat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Intent-log version-3 write/truncate records may reference already durable replacement COW data. Requires org.aros.afsplus:intent-log; older namespace-only replay implementations must reject the volume (ADR-064)."

[[feature]]
id = "org.aros.afsplus:catalog"
short = "catalog"
class = "compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = false
rebuildable = true
discardable = true
description = "Rebuildable global link/object catalog for fast bulk enumeration."

[[feature]]
id = "org.aros.afsplus:change-stream"
short = "change-stream"
class = "compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = false
rebuildable = false
discardable = true
description = "Bounded persistent stream of committed changes. History cannot be reconstructed from current state; discard requires consumers to rescan."

[[feature]]
id = "org.aros.afsplus:inline-data"
short = "inline-data"
class = "incompat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Permits small regular-file payloads inside object metadata."

[[feature]]
id = "org.aros.afsplus:xattrs"
short = "xattrs"
class = "ro_compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Extended attribute storage."

[[feature]]
id = "org.aros.afsplus:sparse"
short = "sparse"
class = "incompat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Sparse logical file ranges."

[[feature]]
id = "org.aros.afsplus:discard"
short = "discard"
class = "compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = false
rebuildable = true
discardable = true
description = "Implementation may issue discard hints. No disk correctness semantics depend on support."

[[feature]]
id = "org.aros.afsplus:data-checksums"
short = "data-checksums"
class = "tbd"
state_model = "disabled-enabled-active"
lifecycle = "reserved"
authoritative = false
rebuildable = "tbd"
discardable = "tbd"
description = "Reserved feature identity for optional user-data checksum metadata. Exact compatibility class and storage are intentionally not frozen."

[[feature]]
id = "org.aros.afsplus:shared-extents"
short = "shared-extents"
class = "ro_compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = true
discardable = false
description = "Shared data extents (reflinks, ADR-061): a volume-wide reference tree counts multi-owner physical runs. Reference counts must be honoured on every write and free, so unsupporting implementations mount read-only. Rebuildable by exhaustive scan of every extent map; never discardable while shared runs exist."

[[feature]]
id = "org.aros.afsplus:data-policy"
short = "data-policy"
class = "compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Persistent per-file data-update policy (ADR-065): object records may carry OBJECT_FLAG_DATA_IN_PLACE, opting the file into ADR-062 private in-place updates. Ignoring implementations always use full data COW, which is strictly stronger; the validated object-flags namespace prevents unaware writers from silently dropping the per-file choice."

[[feature]]
id = "org.aros.afsplus:orphan-directory"
short = "orphan-directory"
class = "ro_compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = true
discardable = false
description = "Reserved internal object ID 2 indexes open-unlinked files for bounded post-close and post-crash cleanup (ADR-066). Unaware writers mount read-only; the visible namespace remains readable."
