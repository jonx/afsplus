registry_version = 2

[[feature]]
id = "org.aros.afsplus:catalog"
short = "catalog"
class = "compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = false
rebuildable = true
discardable = true
description = "Rebuildable global link/object catalog for fast bulk enumeration."

[[feature]]
id = "org.aros.afsplus:change-stream"
short = "change-stream"
class = "compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = false
rebuildable = false
discardable = true
description = "Bounded persistent stream of committed changes. History cannot be reconstructed from current state; discard requires consumers to rescan."

[[feature]]
id = "org.aros.afsplus:inline-data"
short = "inline-data"
class = "incompat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Permits small regular-file payloads inside object metadata."

[[feature]]
id = "org.aros.afsplus:xattrs"
short = "xattrs"
class = "ro_compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Extended attribute storage."

[[feature]]
id = "org.aros.afsplus:sparse"
short = "sparse"
class = "incompat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = false
discardable = false
description = "Sparse logical file ranges."

[[feature]]
id = "org.aros.afsplus:discard"
short = "discard"
class = "compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = false
rebuildable = true
discardable = true
description = "Implementation may issue discard hints. No disk correctness semantics depend on support."

[[feature]]
id = "org.aros.afsplus:data-checksums"
short = "data-checksums"
class = "tbd"
state_model = "disabled-enabled-active"
lifecycle = "reserved"
authoritative = false
rebuildable = "tbd"
discardable = "tbd"
description = "Reserved feature identity for optional user-data checksum metadata. Exact compatibility class and storage are intentionally not frozen."

[[feature]]
id = "org.aros.afsplus:shared-extents"
short = "shared-extents"
class = "ro_compat"
state_model = "disabled-enabled-active"
lifecycle = "experimental"
authoritative = true
rebuildable = true
discardable = false
description = "Shared data extents (reflinks, ADR-061): a volume-wide reference tree counts multi-owner physical runs. Reference counts must be honoured on every write and free, so unsupporting implementations mount read-only. Rebuildable by exhaustive scan of every extent map; never discardable while shared runs exist."
